# Worker Cloudflare de Kilosaurus Temps : l'API (server/worker.js) et l'app (web/).
#   npx wrangler deploy
name = "kilosaurus-temps"
main = "server/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "web"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "kilosaurus-temps"
database_id = "ed9c49af-c25b-466d-99ea-70763b77f053"

# Journées figées (sauvegardes) : toutes les heures à la 5e minute (server/worker.js, scheduled).
[triggers]
crons = ["5 * * * *"]
